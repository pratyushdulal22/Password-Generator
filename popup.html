<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Strong Password Generator</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
<main class="wrap">
  <h1>Strong Password Generator</h1>
  <div class="tabs">
    <button class="tab active" id="tabGen">Generator</button>
    <button class="tab" id="tabSaved">Saved</button>
  </div>
  <div class="toast" id="toast"></div>

  <div id="viewGen">
  <section class="box out">
    <div id="pw" aria-live="polite"></div>
    <button class="icon" id="regen" title="Generate new password" aria-label="Generate new password">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0 1 15.5-6.2L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-15.5 6.2L3 16"/><path d="M3 21v-5h5"/></svg>
    </button>
    <button class="icon" id="pinBtn" title="Pin this password" aria-label="Pin this password">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 17v5"/><path d="M9 10.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24V16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V7a1 1 0 0 1 1-1 2 2 0 0 0 0-4H8a2 2 0 0 0 0 4 1 1 0 0 1 1 1z"/></svg>
    </button>
    <button class="icon" id="copy" title="Copy password" aria-label="Copy password">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v1"/></svg>
    </button>
  </section>
  <h2>Options</h2>
  <section class="box">
    <label class="title" for="len">Length</label>
    <input type="number" id="len" value="28" min="5" max="148" step="1" inputmode="numeric">
    <p class="hint" id="lenHint">Value must be between 5 and 148.</p>
  </section>

  <section class="box">
    <h2>Include</h2>
    <div class="checks">
      <label class="check"><input type="checkbox" id="upper" checked> A-Z</label>
      <label class="check"><input type="checkbox" id="lower" checked> a-z</label>
      <label class="check"><input type="checkbox" id="numbers" checked> 0-9</label>
      <label class="check"><input type="checkbox" id="special"> !@#$%^&amp;*</label>
    </div>
  </section>
  </div>

  <div id="viewSaved" hidden>
    <h2>Pinned</h2>
    <section class="box" id="pinnedList"></section>
    <div class="head">
      <h2>Last 10 passwords</h2>
      <button class="link" id="clearHistory">Clear</button>
    </div>
    <section class="box" id="historyList"></section>
  </div>
</main>
<script src="popup.js"></script>
</body>
</html>
